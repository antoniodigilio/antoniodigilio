name: Aggiorna statistiche

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Genera stats.svg
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/generate-stats.mjs
      - name: Commit se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git diff --staged --quiet || (git commit -m "chore: aggiorna statistiche" && git push)
